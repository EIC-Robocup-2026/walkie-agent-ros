# RAI configuration, read by rai.get_llm_model() from the working directory.
# Full reference: https://robotecai.github.io/rai/setup/vendors/
#
# The `openai` vendor works with any OpenAI-compatible endpoint. Here it points
# at OpenRouter (same provider walkie-agent-v2 used); set OPENAI_API_KEY to an
# OpenRouter key. For a local server (vLLM, llama.cpp), change base_url.

[vendor]
simple_model = "openai"
complex_model = "openai"
embeddings_model = "openai"

[openai]
simple_model = "qwen/qwen3.8-27b:nitro"
complex_model = "deepseek/deepseek-v4.1-flash:nitro"
embeddings_model = "openai/text-embedding-3-small"
base_url = "https://openrouter.ai/api/v1"

# Local models served by Ollama. Used only when a [vendor] entry is "ollama".
[ollama]
simple_model = "llama3.2"
complex_model = "llama3.1:70b"
embeddings_model = "llama3.2"
base_url = "http://localhost:11434"

[tracing]
project = "walkie-agent-ros"

# To trace agent runs, start the local server with `pixi run langfuse-up` and
# set use_langfuse = true. Requires LANGFUSE_PUBLIC_KEY/SECRET_KEY in .env.
[tracing.langfuse]
use_langfuse = false
host = "http://localhost:3000"

[tracing.langsmith]
use_langsmith = false
host = "https://api.smith.langchain.com"

# Speech input (speech-to-text), used by `pixi run voice-asr`.
# transcription_model: "LocalWhisper" or "FasterWhisper" (local, free), or
# "OpenAI" (needs a real OpenAI key, not the OpenRouter key in .env).
# List microphone names with: pixi run list-audio-devices
# "default" is the system's default microphone, through PipeWire.
[asr]
recording_device_name = "default"
transcription_model = "LocalWhisper"
language = "en"
vad_model = "SileroVAD"
# Seconds of silence before the recording is cut and transcribed. Too short
# splits a sentence at every pause.
silence_grace_period = 1.0
# Speech probability (0-1) that counts as voice. Raise it in a noisy room.
vad_threshold = 0.3
use_wake_word = false
wake_word_model = ""
wake_word_threshold = 0.5
wake_word_model_name = ""
transcription_model_name = "tiny"

# Speech output (text-to-speech), used by `pixi run voice-tts`.
# vendor: "KokoroTTS" (local, free; downloads ~300 MB of model files on first
# use), "OpenTTS" (needs its Docker server) or "ElevenLabs" (cloud; needs
# ELEVENLABS_API_KEY and a voice). An empty voice uses the vendor's default.
# speaker_device_name: as recording_device_name in [asr].
[tts]
vendor = "KokoroTTS"
voice = ""
speaker_device_name = "default"

# Perception, gaze and LLM call values to tune on the robot, read by the agent
# at start-up (src/walkie_agent/tuning.py; hri.md, Delivery order). The values
# shown are the defaults in the code. Uncomment a table and the keys you
# change. A missing key keeps its default. An unknown table, key or model, a
# table such as [gaze] without its walkie. prefix, or a value that is not a
# number or out of range, stops the agent with a list of the problems.
# The same file runs the simulation, so values tuned here change sim runs too.
#
# How long find_people and find_seats wait for TF at an image's stamp, in
# seconds. Chosen in simulation; raise it if TF lags the camera on the robot.
# [walkie.perception]
# tf_timeout_s = 0.2
#
# Who counts as close in front for find_people(in_front=True). Tuned in
# simulation only; tune at the arena's door with team members walking past.
# min_face_rad is the smallest face, as an angle. 0.10 rad is about 107 px at
# the ZED 2i's nominal fx of 1066 px. It may not go below min_face_size_rad,
# so that a person kept in front can be recognized. half_angle_deg is the
# largest angle, in degrees, between the face's heading and the base's.
# [walkie.perception.front]
# min_face_rad = 0.10
# half_angle_deg = 25.0
#
# The smallest face that is collected and recognized, as an angle: v2's 50 px
# over the ZED 2i's nominal fx. Set it to 50 px over the robot's own k[0].
# [walkie.perception.vision_feed]
# min_face_size_rad = 0.0469
#
# The largest cosine distance, above 0 and below 2, at which a stored face or
# appearance names a person, by model. Only the models listed in
# perception/identity.py can be set. Tune them with team members.
# [walkie.perception.identity.face_distance_limits]
# arcface_w600k_r50 = 0.4
# [walkie.perception.identity.appearance_distance_limits]
# osnet_x1_0_msmt17 = 0.5
#
# How long the gaze loop (ADR-0051) keeps a people array that waits for TF to
# reach its stamp, in seconds. Chosen in simulation; raise it if TF lags the
# camera on the robot. The loop's gain, speeds and deadband are v2's, tuned on
# the robot, and stay in the code.
# [walkie.gaze]
# tf_wait_s = 0.2
#
# The bounds on each call of the agent's LLM, in seconds, for the openai
# vendor only (ADR-0042; src/walkie_agent/llm_deadline.py). timeout_s is the
# whole call, checked on every chunk of the streamed reply, so a provider that
# keeps sending keep-alive comments cannot hold the robot past it.
# read_timeout_s is the longest silence, and may not be above timeout_s.
# Connecting may take 5 s, and a failed call is never retried.
# [walkie.models.agent]
# timeout_s = 20.0
# read_timeout_s = 10.0
