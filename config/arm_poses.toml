# The named arm poses the LLM may ask for (ADR-0022, docs/architecture/
# manipulation.md, "Pose configuration"). The LLM sees names and
# descriptions, never joint values.
#
# Joint values are radians, keyed by joint name: the order sent to the
# commander comes from /get_joint_states at run time. Poses never set the
# lift (ADR-0026), so a pose runs at whatever height the lift is at. At
# startup, walkie_agent.arm.poses checks every pose against
# config/robot_model.toml, the snapshot of the pinned walkie-ros commit, and
# lists every error at once.
#
# Keys of a pose:
#   description     shown to the LLM
#   travel_safe     true when the robot may drive with an arm in this pose
#                   (ADR-0025)
#   srdf_state      the SRDF group state the tables copy. The loader checks
#                   that they still equal it, so a retune in walkie-ros is
#                   copied on purpose. Drop it when retuning a pose here.
#   offered         false keeps the pose from the LLM (default true)
#   both_arms       false when the two tables cannot be sent together as one
#                   both_arms goal (default true)
#   tried_on_robot  true once the pose has run on the robot through
#                   /set_joint_position with collision checking on. Until
#                   then only the simulation offers it (default false).
#   timeout_s       how long a move to the pose may take (default 30)
#   left, right     the joint table of each arm the pose can move

[grippers]
# Travel of one finger, in metres. The jaw opens about twice as wide.
open_position = 0.044    # the SRDF's "open"
half_position = 0.036    # above 0.03, or it counts as a close (the SRDF's
                         # "half_closed", 0.022, does)
closed_position = 0.0    # the SRDF's "closed". At most 0.03, so grasp
                         # detection runs

[poses.home]
srdf_state = "home"
travel_safe = true       # walkie-agent-v2 drove and carried objects in it
tried_on_robot = true
description = "Both arms down beside the body, elbows almost straight."

[poses.home.left]
openarm_left_joint1 = 0.2618
openarm_left_joint2 = 0.0
openarm_left_joint3 = 0.0
openarm_left_joint4 = 0.2618
openarm_left_joint5 = 0.0
openarm_left_joint6 = 0.0
openarm_left_joint7 = 0.0

[poses.home.right]
openarm_right_joint1 = -0.2618
openarm_right_joint2 = 0.0
openarm_right_joint3 = 0.0
openarm_right_joint4 = 0.2618
openarm_right_joint5 = 0.0
openarm_right_joint6 = 0.0
openarm_right_joint7 = 0.0

