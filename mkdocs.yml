site_name: Walkie Agent ROS
site_description: Documentation for the Walkie agent ROS 2 workspace (EIC RoboCup 2026)
site_url: https://eic-robocup-2026.github.io/walkie-agent-ros/
repo_url: https://github.com/EIC-Robocup-2026/walkie-agent-ros
repo_name: EIC-Robocup-2026/walkie-agent-ros
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit

plugins:
  - search

# Links that start with "/" are resolved from docs/, so a link inside an ADR
# works both on the ADR's own page and where it is embedded.
validation:
  links:
    absolute_links: relative_to_docs

# ADRs are embedded in the architecture pages instead of listed in the menu.
not_in_nav: |
  architecture/decisions/*

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  # Embeds ADR files into the architecture pages. Paths are relative to docs/,
  # and a missing file or section fails the build.
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Run HRI on the Robot: robot-hri-run.md
  - Setup Log:
      - setup/index.md
      - 1. Create the Pixi Workspace: setup/01-pixi-workspace.md
      - 2. Add the Documentation Site: setup/02-documentation.md
      - 3. Install RAI: setup/03-ros-and-rai.md
      - 4. Trace with Local Langfuse: setup/04-langfuse.md
      - 5. Limit What Tools Can Touch: setup/05-tool-access.md
      - 6. Give Walkie an Identity: setup/06-whoami.md
      - 7. Talk to Walkie by Voice: setup/07-voice.md
  - Learn the Agent:
      - learn/index.md
      - 1. RAI Runs It, We Own the Graph: learn/rai-and-our-graph.md
      - 2. What Changed from the Old Agent: learn/old-vs-new.md
      - "3. The Graph: llm, tools and gate": learn/the-graph.md
      - 4. One Task, Start to Finish: learn/one-task.md
      - 5. Todo Items and Ops: learn/todo-items.md
      - "6. The Rules: Ledger and Window": learn/todo-rules.md
      - 7. Asking a Question: learn/asking-questions.md
      - 8. Queue, Stop, Reset and Repair: learn/queue-stop-reset.md
      - 9. Seeding a Task: learn/seeding.md
      - 10. Watching Progress: learn/watching-progress.md
      - 11. Read the Code Next: learn/read-the-code.md
  - Architecture:
      - architecture/index.md
      - The Agent: architecture/agent.md
      - Robot Capabilities (Proposed): architecture/capabilities.md
      - Arm Manipulation (Proposed): architecture/manipulation.md
      - Perception (Proposed): architecture/perception.md
      - HRI Task (Proposed): architecture/hri.md
      - Self-Evolving Agent (Proposed): architecture/self-evolving-agent.md
      - Access Levels and Generated Tools (Proposed): architecture/access-levels.md
      - Competition Mode (Proposed): architecture/competition.md
      - Sim Harvest (Proposed): architecture/harvest.md
