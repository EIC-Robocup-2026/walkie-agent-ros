[workspace]
authors = ["natapol2547 <robloxplay41@gmail.com>"]
channels = ["https://prefix.dev/robostack-jazzy", "https://prefix.dev/conda-forge"]
name = "walkie-agent-ros"
platforms = ["linux-64"]
version = "0.1.0"

# Sources ros2_ws/install/local_setup.sh (when built) so rai_interfaces is importable.
[activation]
scripts = ["scripts/activate.sh"]

[dependencies]
# RAI supports Python >=3.10,<3.13; RoboStack Jazzy builds for 3.12.
python = "3.12.*"
# Pixi solves conda packages first, then PyPI packages must fit around them.
# These pins keep conda from choosing versions that rai-core's PyPI deps reject:
#   numpy<2      required by rai-core
#   packaging<26 required by langfuse 3.x (a rai-core dependency)
#   py-opencv<5  required by rai-core (opencv-python<5); cv_bridge pulls OpenCV
numpy = "<2"
packaging = "<26"
py-opencv = "<5"
ros-jazzy-ros-base = "*"
# ROS packages rai-core imports at module load time.
ros-jazzy-cv-bridge = "*"
ros-jazzy-nav2-msgs = "*"
ros-jazzy-tf2-geometry-msgs = "*"
ros-jazzy-tf-transformations = "*"
# Build toolchain for message packages in ros2_ws/src (rai_interfaces).
colcon-common-extensions = "*"
vcstool = "*"
c-compiler = "*"
cxx-compiler = "*"
cmake = "*"
pkg-config = "*"
make = "*"
pytest = "*"
ros-jazzy-rqt-graph = ">=1.5.6,<2"
# Voice (rai_s2s): sounddevice needs the PortAudio library, and KokoroTTS
# downloads its model files with wget on first use.
portaudio = "*"
wget = "*"

# Python packages that are not on conda-forge come from PyPI. Pixi resolves
# these together with the conda packages above into the same environment.
[pypi-dependencies]
rai-core = ">=2.12.1, <2.13"
python-dotenv = ">=1.0"
walkie-agent = { path = ".", editable = true }
# rai_s2s and rai_whoami are not published on PyPI for this RAI release, so
# they come from the RAI repository. Tag 2.12.2 has the same rai_s2s and
# rai_whoami sources as 2.12.1 (our rai-core), but drops a broken submodule
# entry that makes a git install of 2.12.1 fail.
# rai_s2s imports every speech backend at import time, so all extras except
# the GPU one are required even though we only use Whisper and Kokoro.
rai-s2s = { git = "https://github.com/RobotecAI/rai.git", tag = "2.12.2", subdirectory = "src/rai_s2s", extras = [
  "elevenlabs",
  "whisper",
  "fasterwhisper",
  "wakeword",
  "kokoro",
] }
rai-whoami = { git = "https://github.com/RobotecAI/rai.git", tag = "2.12.2", subdirectory = "src/rai_whoami" }
# rai_s2s pins torchaudio 2.3.1, which pulls torch 2.3.1. The PyPI wheels are
# CUDA 12.1 builds (NVIDIA driver 525 or newer), so Whisper runs on the GPU
# when one is present and falls back to the CPU otherwise.

[tasks.clone-ros2-ws]
cmd = "vcs import --input ros2_ws.repos"
outputs = ["ros2_ws/src/rai_interfaces/package.xml"]
description = "Clone source-only ROS 2 packages (rai_interfaces)"

# Python3_EXECUTABLE is passed explicitly so a user-level ~/.colcon/defaults.yaml
# (often set for an apt ROS install) cannot point CMake at the system Python.
[tasks.build-ros2]
cmd = "colcon build --symlink-install --cmake-args -DPython3_EXECUTABLE=$CONDA_PREFIX/bin/python"
cwd = "ros2_ws"
depends-on = ["clone-ros2-ws"]
description = "Build ros2_ws with colcon"

[tasks.fake-walkie]
cmd = "python -m walkie_agent.sim.fake_walkie"
description = "Run a fake robot (Nav2 action, TF, speech topic) for testing without hardware"

[tasks.agent]
cmd = "python -m walkie_agent.main"
description = "Run the Walkie RAI agent (reads tasks from /from_human)"

[tasks.test]
cmd = "pytest"
description = "Run the test suite"

# Self-hosted Langfuse for tracing agent runs. Needs Docker on the host.
# See docs/setup/04-langfuse.md.
[tasks.langfuse-setup]
cmd = "python scripts/langfuse_setup.py"
description = "Generate Langfuse server secrets and add its API keys to .env"

[tasks.langfuse-up]
cmd = "docker compose --file docker/langfuse/compose.yml up --detach --wait --wait-timeout 300"
depends-on = ["langfuse-setup"]
description = "Start the local Langfuse server at http://localhost:3000"

[tasks.langfuse-down]
cmd = "docker compose --file docker/langfuse/compose.yml down"
description = "Stop the local Langfuse server (traces are kept)"

[tasks.langfuse-logs]
cmd = "docker compose --file docker/langfuse/compose.yml logs --follow langfuse-web langfuse-worker"
description = "Follow the Langfuse server logs"

[tasks.langfuse-reset]
cmd = "docker compose --file docker/langfuse/compose.yml down --volumes && rm docker/langfuse/.env"
description = "Delete the local Langfuse server, its stored traces and its secrets"

[feature.docs.tasks]
docs = "mkdocs serve"
docs-build = "mkdocs build --strict"

[feature.docs.dependencies]
mkdocs-material = ">=9.7,<10"
mkdocs = ">=1.6,<2"

[environments]
docs = { features = ["docs"], no-default-feature = true }
