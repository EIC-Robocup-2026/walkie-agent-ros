[project]
name = "walkie-agent"
version = "0.1.0"
description = "RAI-based agent for the Walkie robot (EIC RoboCup 2026)"
requires-python = ">=3.12,<3.13"
# Runtime dependencies (rai-core, ROS 2) are declared in pixi.toml.
dependencies = []

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ROS 2 ships pytest plugins (launch_testing, etc.) that are not needed here.
addopts = "-p no:launch_testing -p no:launch_ros -p no:ament_copyright -p no:ament_flake8 -p no:ament_pep257 -p no:ament_xmllint -p no:ament_lint"
# A test's setup, call and teardown together: faulthandler prints every stack,
# then tests/hang_watchdog.py makes the test an error. The slowest test takes
# about 5 s on an idle computer.
faulthandler_timeout = 120
walkie_hang_timeout = 150
