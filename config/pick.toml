# How pick_object approaches and grasps a remembered object (decision PK-4). The
# LLM never sees these numbers (ADR-0022). walkie_agent.arm.pick reads this file,
# from the working directory, at startup with --arms and --object-memory and again
# at each pick, so a change here applies to the next pick without a restart.
#
# The robot drives to a stand-off pose facing the object's remembered centre, then
# the hand link (openarm_right_hand) goes to a pre-grasp pose through the
# commander's whole-body group, moves straight in to the grasp pose, the gripper
# closes, the hand moves straight up and then beside the base, and both arms go
# home, the picking arm with the lift at home_lift_m. The numbers below picked the Chula
# simulation's water bottle on 2026-11-20. The checks at the end of the file, on the
# sighting's age, the object's shift and the reach envelope, were derived from that
# pick and the arm's reach afterwards. Later end-to-end picks in the Chula simulation
# the same day ran them after the drive, before the whole-body reach and right before
# the straight approach, and held the bottle. None of the numbers has been tried on
# the robot.

# The arm that picks: "left" or "right".
arm = "right"
# The frame of every hand target. The object memory keeps positions in it.
frame_id = "map"

# Where base_footprint stands at the stand-off pose, which faces along the approach
# heading: standoff_m back from the object's centre along the heading, and
# standoff_left_m to the left of that line (negative is to the right). Standing to
# the left puts the object ahead of the right hand, which hangs right of the base's
# centre. The hand then moves in along the line from where the base stopped to the
# object, not along the heading. walkie-ros's scripted bottle pick
# (sim_bottle_pick.py) proved 0.65 and 0.20 in the Chula room: the arm then usually
# reaches with the base still. From 0.90 m straight behind, the whole-body reach
# moved and turned the base, and the collision monitor once stopped it.
standoff_m = 0.65
standoff_left_m = 0.20
# The approach headings to try, in degrees, in order: each is added to the heading
# whose stand-off line the robot already stands on. The next one is tried when Nav2 cannot
# reach the stand-off pose of the one before. The last three come from the far side:
# from the Chula kitchen table's own place, north of the table, every stand-off within
# 60 degrees of the water bottle at its south-west corner lay on the table.
heading_offsets_deg = [0.0, 30.0, -30.0, 60.0, -60.0, 120.0, -120.0, 180.0]

# Metres the hand link stands back from the object's centre at the grasp pose, along
# the hand's approach. openarm_right_hand_tcp is 0.08 m along the hand link's +z, so 0.06
# puts the tool centre point 0.02 m past the centre, the depth that walkie-ros's
# scripted pick and its offline check_grasp.py proved for the water bottle.
grasp_back_m = 0.06
# Metres the pre-grasp pose stands back from the grasp pose, along the approach.
pregrasp_back_m = 0.10
# Metres the hand rises after the gripper holds the object.
lift_m = 0.10
# Where the hand then moves in a straight line, at the lifted height, before the arm
# goes home: clear_forward_m ahead of base_footprint and clear_side_m out to the
# picking arm's side. The move home swings the hand down toward the base; started
# over the table, it dragged the Chula bottle across the table's corner and out of
# the fingers. From 0.30 and 0.35 the bottle stayed in the hand (2026-11-20).
clear_forward_m = 0.30
clear_side_m = 0.35
# The lift's height, in metres, when the picking arm goes home at the end of a pick:
# the home state of right_arm_lift in walkie-ros's SRDF. The straight moves can lower
# the lift by over 0.1 m, and with the lift that low the arm's home pose touches the
# base, so the move home goes through the arm's *_lift group and raises it back.
home_lift_m = 0.7435

# The hand's orientation, in degrees. Yaw is the direction of the hand's approach,
# from the base to the object, plus hand_yaw_offset_deg. Pitch -90 with the yaw
# turned by 180 puts the hand link's +z, the direction the fingers point, along the
# approach with the wrist camera bracket up. With pitch 90 and no offset the fingers point the same way, but the bracket
# hangs 0.11 m below the hand and reaches the table top at a bottle's centre height
# (walkie-ros sim_bottle_pick.py, hand_rpy).
hand_roll_deg = 0.0
hand_pitch_deg = -90.0
hand_yaw_offset_deg = 180.0

# Seconds each motion may take: the whole-body reach to the pre-grasp pose, which
# plans for the base, the lift and the arm, and each straight-line move of the arm.
reach_timeout_s = 90.0
cartesian_timeout_s = 30.0

# After the drive, before the whole-body reach and before the straight approach,
# pick_object goes on only with an object the object memory saw at most
# max_observation_age_s seconds ago. Older, it waits up to observation_wait_s
# seconds for a newer sighting, then refuses with no further arm goal. The memory saves
# a sighting about every 2 s while the object stays in view, and the Chula
# simulation's sightings were about 1 s old, so 5 s allows two missed saves. There
# is no head to point at the object yet, so the stand-off pose must leave it in view.
max_observation_age_s = 5.0
observation_wait_s = 6.0
# Metres the object's centre may have moved from one reading to the next: from the
# position pick_object drove to, to the sighting after the drive, to the one before
# the whole-body reach, to the one before the straight approach. Further, it refuses
# and asks the agent to call pick_object again, which plans a new stand-off pose from
# the new position.
max_target_shift_m = 0.15

# The envelope every pick must fit after the drive, before the first arm goal, and
# again before the whole-body reach; outside it, pick_object refuses and sends no
# further arm goal. Heights are in metres above the frame's floor, where
# base_footprint stands.
# The object's centre height: a table or counter top object. The Chula water
# bottle's centre stood at 0.862 m. The hand approaches level, so it works near the
# height of the arm's shoulder, which the lift moves between about 0.54 and 1.28 m
# above the floor. The upper bound plus lift_m stays under that top.
min_target_z_m = 0.55
max_target_z_m = 1.15
# How far across the floor the object and each hand pose (pregrasp, grasp, lift,
# clear) may lie from base_footprint where the base stopped. With the numbers above
# the Chula pick had the object 0.68 m away, pregrasp 0.52, grasp and lift 0.62 and
# clear 0.46; the base stopping 0.10 m short or long moves the object to 0.58 to
# 0.78. The arm's hand link reaches about 0.87 m from base_footprint at full stretch.
min_reach_m = 0.35
max_reach_m = 0.90
# How high each hand pose may be: from just under the lowest object to just over
# the shoulder's highest point (the Chula pick's hand poses stood 0.862 to 0.962 m
# high).
min_reach_z_m = 0.50
max_reach_z_m = 1.30
