# Named places for walkie-ros's MuJoCo world chula_pat14_6, a copy of the
# lab room (pixi run agent-sim-chula).
#
# Launch the world with world:=chula_pat14_6 from walkie-ros
# feat/chula-pat14-6-simulation. Its map frame is the captured occupancy map of
# the room, not the start pose, and AMCL localizes in it.
#
# The poses are the nav approach goals of the world's authoring file,
# simulation/mujoco/worlds/chula_pat14_6/authoring/source/
# 30_16102026_ChulaPat14_6_world.toml on that branch: its [rooms], [locations]
# and [doors] entrance_door, which this file calls "entrance". The world spells
# its rooms living_room and kitchen_room; these names use a space, as the GPSR
# command data and FakeRobot do, and as walkie-database's sim seed requires
# for a room's stand pose (seed_sim --locations). "trash" and
# "instruction point" are invented: the arena data has neither, and generated
# commands assume both (decision 26). They sit in the most open floor of their
# rooms, because Nav2 could not finish a goal at their first poses (decision
# G4-6). The same names and coordinates are in FakeRobot's
# CHULA_PAT14_6_PLACES, and tests/test_locations.py keeps the two equal.
#
# On 2026-11-06 Nav2 reached every place here in MuJoCo, from the living room
# spawn of scripts/chula-sim.sh (docs/setup/08-chula-simulation.md).
#
# A room is a place whose room is itself. x, y in meters; yaw in radians
# (0 = facing +x).

[locations."living room"]
x = 1.7629
y = -1.483
yaw = 0.0
room = "living room"
description = "A room: the living room, with the sofa and the TV. The entrance door opens into it."

