[workspace]
authors = ["natapol2547 <robloxplay41@gmail.com>"]
channels = ["https://prefix.dev/robostack-jazzy", "https://prefix.dev/conda-forge"]
name = "walkie-agent-ros"
platforms = ["linux-64"]
version = "0.1.0"

# Sources ros2_ws/install/local_setup.sh (when built) so rai_interfaces is
# importable, and preloads a loader that opens rmw_zenoh_cpp 0.2.11 under
# Zenoh (ADR-0032, ADR-0033).
[activation]
scripts = ["scripts/activate.sh"]

# walkie-ros and the robot use Zenoh, so every `pixi run` and `pixi shell` here
# does too (ADR-0033). There is no Zenoh config: nodes connect to a router at
# localhost:7447, rmw_zenoh's default, which must be running
# (`pixi run ros2 run rmw_zenoh_cpp rmw_zenohd`). This value replaces one
# exported in the calling shell. To use another middleware, set
# RMW_IMPLEMENTATION in a task's env, or for one command:
#   pixi run env RMW_IMPLEMENTATION=rmw_fastrtps_cpp <command>
# The tests switch to Fast DDS themselves, in tests/conftest.py (ADR-0019).
[activation.env]
RMW_IMPLEMENTATION = "rmw_zenoh_cpp"

[dependencies]
# RAI supports Python >=3.10,<3.13; RoboStack Jazzy builds for 3.12.
python = "3.12.*"
# Pixi solves conda packages first, then PyPI packages must fit around them.
# These pins keep conda from choosing versions that rai-core's PyPI deps reject:
#   numpy<2      required by rai-core
#   packaging<26 required by langfuse 3.x (a rai-core dependency)
#   py-opencv<5  required by rai-core (opencv-python<5); cv_bridge pulls OpenCV
numpy = "<2"
packaging = "<26"
py-opencv = "<5"
ros-jazzy-ros-base = "*"
# ROS packages rai-core imports at module load time.
ros-jazzy-cv-bridge = "*"
ros-jazzy-nav2-msgs = "*"
ros-jazzy-tf2-geometry-msgs = "*"
ros-jazzy-tf-transformations = "*"
# The ROS 2 middleware, set for every task in [activation.env] above.
# walkie-ros has RoboStack's 0.2.11, but that build needs a newer ROS stack
# that requires OpenCV 5, which rai-core rejects. RoboStack's 0.2.10 is built
# on the same Zenoh library (libzenohc 1.9.0).
# 0.2.10's rmw_wait can block forever, so `pixi run build-rmw-zenoh` builds
# 0.2.11 from source, and the loader that scripts/activate.sh preloads opens
# it in place of this one (ADR-0032, ADR-0033). This package still provides
# the router, rmw_zenohd.
ros-jazzy-rmw-zenoh-cpp = "0.2.10.*"
# Build toolchain for message packages in ros2_ws/src (rai_interfaces).
colcon-common-extensions = "*"
vcstool = "*"
c-compiler = "*"
cxx-compiler = "*"
cmake = "*"
pkg-config = "*"
make = "*"
# rai_interfaces also builds against vision_msgs, which ros-base does not
# include. Without it here, CMake falls back to an apt ROS install on PATH, if
# there is one, and the build fails on computers without it.
ros-jazzy-vision-msgs = "*"
pytest = "*"
ros-jazzy-rqt-graph = ">=1.5.6,<2"
# Voice (rai_s2s): sounddevice needs the PortAudio library, and KokoroTTS
# downloads its model files with wget on first use.
portaudio = "*"
wget = "*"

# Python packages that are not on conda-forge come from PyPI. Pixi resolves
# these together with the conda packages above into the same environment.
[pypi-dependencies]
rai-core = ">=2.12.1, <2.13"
python-dotenv = ">=1.0"
# src/walkie_agent/llm_deadline.py builds the LLM's HTTP client on them.
# rai-core's langchain-openai pulls both in already; naming them here keeps an
# update of langchain-openai from moving them past the API that file uses
# (openai 3 is built on httpx2).
openai = ">=3.29,<4"
httpx2 = ">=2.13,<3"
walkie-agent = { path = ".", editable = true }
# rai_s2s and rai_whoami are not published on PyPI for this RAI release, so
# they come from the RAI repository. Tag 2.12.2 has the same rai_s2s and
# rai_whoami sources as 2.12.1 (our rai-core), but drops a broken submodule
# entry that makes a git install of 2.12.1 fail.
# rai_s2s imports every speech backend at import time, so all extras except
# the GPU one are required even though we only use Whisper and Kokoro.
rai-s2s = { git = "https://github.com/RobotecAI/rai.git", tag = "2.12.2", subdirectory = "src/rai_s2s", extras = [
  "elevenlabs",
  "whisper",
  "fasterwhisper",
  "wakeword",
  "kokoro",
] }
rai-whoami = { git = "https://github.com/RobotecAI/rai.git", tag = "2.12.2", subdirectory = "src/rai_whoami" }
# The doorbell detector runs YAMNet on ONNX Runtime (walkie_agent.doorbell,
# ADR-0054). rai_s2s already requires it, at this range, for Silero VAD and
# Kokoro; it is named here because the detector imports it itself.
onnxruntime = ">=1.24.4, <1.25"
# rai_s2s pins torchaudio 2.3.1, which pulls torch 2.3.1. The PyPI wheels are
# CUDA 12.1 builds (NVIDIA driver 525 or newer), so Whisper runs on the GPU
# when one is present and falls back to the CPU otherwise.

# ros2_ws.repos is an input so that a changed pin runs vcs import again. With
# outputs alone, Pixi skips the task once the clones exist, and build-ros2
# keeps building the old commit.
[tasks.clone-ros2-ws]
cmd = "vcs import --input ros2_ws.repos"
inputs = ["ros2_ws.repos"]
outputs = [
  "ros2_ws/src/rai_interfaces/package.xml",
  "ros2_ws/src/walkie-database/ros2_ws/src/walkie_database_msgs/package.xml",
  "ros2_ws/src/walkie-vision/ros2_ws/src/walkie_vision_msgs/package.xml",
  "ros2_ws/src/walkie-ros/manipulate/my_robot_interfaces/package.xml",
]
description = "Clone source-only ROS 2 packages (rai_interfaces, walkie-database, walkie-vision, walkie-ros)"

# Python3_EXECUTABLE is passed explicitly so a user-level ~/.colcon/defaults.yaml
# (often set for an apt ROS install) cannot point CMake at the system Python.
# --packages-select is an allow-list: colcon builds only the packages named
# here. The walkie-database, walkie-vision and walkie-ros clones hold whole
# repositories, and the agent needs only their messages; walkie-ros's other
# packages need MoveIt, ros2_control and drivers that this environment does
# not have. Name every message package from ros2_ws.repos here; a package
# missing from the list is not built, and fails only at import.
[tasks.build-ros2]
cmd = """colcon build --symlink-install \
  --packages-select rai_interfaces walkie_database_msgs walkie_vision_msgs my_robot_interfaces \
  --cmake-args -DPython3_EXECUTABLE=$CONDA_PREFIX/bin/python"""
cwd = "ros2_ws"
depends-on = ["clone-ros2-ws"]
description = "Build the message packages in ros2_ws with colcon"

[tasks.clone-rmw-zenoh]
cmd = "vcs import --input rmw_zenoh_ws.repos"
outputs = [
  "rmw_zenoh_ws/src/rmw_zenoh/rmw_zenoh_cpp/package.xml",
  "rmw_zenoh_ws/src/zenoh-cpp/CMakeLists.txt",
]
description = "Clone rmw_zenoh 0.2.11 and zenoh-cpp 1.9.0 sources"

# A separate workspace from ros2_ws, so CI's build-ros2 does not spend minutes
# compiling a middleware the tests never use (they run on Fast DDS). The
# vendor, security tools and test packages are ignored: rmw_zenoh_cpp builds
# against the environment's zenoh_cpp_vendor and libzenohc instead.
# The second step builds the loader that scripts/activate.sh preloads
# (ADR-0033). LD_PRELOAD is cleared because CMake overwrites the installed
# library in place, and the loader would have it open in every build process.
[tasks.build-rmw-zenoh]
cmd = """colcon build \
  --packages-ignore zenoh_cpp_vendor zenoh_security_tools test_rmw_zenoh_cpp \
  --cmake-args -DPython3_EXECUTABLE=$CONDA_PREFIX/bin/python -DCMAKE_BUILD_TYPE=Release \
  -DBUILD_TESTING=OFF -DZENOHCXX_ENABLE_TESTS=OFF -DZENOHCXX_ENABLE_EXAMPLES=OFF \
  && mkdir -p install/rmw_zenoh_loader/lib \
  && cc -shared -fPIC -O2 -Wall -Wextra ../scripts/rmw_zenoh_loader.c -ldl \
  -o install/rmw_zenoh_loader/lib/librmw_zenoh_loader.so"""
cwd = "rmw_zenoh_ws"
env = { LD_PRELOAD = "" }
depends-on = ["clone-rmw-zenoh"]
description = "Build rmw_zenoh_cpp 0.2.11 and the loader that uses it in place of RoboStack's 0.2.10 (ADR-0032, ADR-0033)"

[tasks.fake-walkie]
cmd = "python -m walkie_agent.sim.fake_walkie"
description = "Run a fake robot (Nav2 action, TF, speech topic) for testing without hardware"

[tasks.agent]
cmd = "python -m walkie_agent.main"
description = "Run the Walkie RAI agent (reads tasks from /from_human)"

# The HRI task on the real robot; the steps are in docs/robot-hri-run.md. It
# runs on walkie-ros's domain 23 (ADR-0017) and uses the robot's Zenoh router
# on localhost:7447. config/locations.robot.toml lists door and living_room
# without coordinates, so the agent refuses to start until they are measured
# on the arena map. Without --mock-people-memory, the people tools use
# walkie-database's people services, on the same domain and router.
# --tool-log writes logs/agent_tools_<time>.jsonl, the record of the run.
# --arms is left out. It waits for the robot track's MotionSupervisor
# (capability layer PR C, docs/architecture/manipulation.md), which stops
# MoveIt on a reset and refuses arm motion during any drive, and for robot
# steps R0 to R4. Without it, the hri template is refused at start, because
# its bag step needs set_gripper. Once PR C has landed and the runbook's arm
# steps are done, run `pixi run agent-robot-hri --arms`, then add --arms to
# cmd here.
[tasks.agent-robot-hri]
cmd = "python -m walkie_agent.main --locations config/locations.robot.toml --tool-log"
env = { ROS_DOMAIN_ID = "23" }
description = "Run the agent for the HRI task on the real robot (domain 23)"

# The agent against walkie-ros's MuJoCo simulation (blank map). It uses the
# Zenoh router on localhost:7447, from either repository, and the calling
# shell's ROS_DOMAIN_ID, which must match the simulation's (ADR-0036). See
# docs/getting-started.md. --mock-people-memory keeps the people that
# recognize_person and remember_person store in an in-memory mock, cleared at
# every new task: the simulation's fake vision models have no vector tables
# in walkie-database. --arms loads the arm tools on walkie-ros's
# bimanual_commander and the arm check before every drive. The robot tasks
# `agent` and `agent-robot-hri` leave both out: --arms waits for the robot
# track's MotionSupervisor (manipulation.md), and without
# --mock-people-memory the two people tools use walkie-database's people
# services.
[tasks.agent-sim]
cmd = "python -m walkie_agent.main --use-sim-time --locations config/locations.sim.toml --mock-people-memory --arms"
description = "Run the agent against walkie-ros's MuJoCo simulation (the shell's ROS_DOMAIN_ID)"

# The HRI scenario in walkie-ros's chula_pat14_6 world: the guests, the seats
# and their answers, with the oracle publishing the vision arrays. Start it
# after the world's launch (world:=chula_pat14_6) and before agent-sim-hri.
# It writes its event log to logs/ and uses the calling shell's ROS_DOMAIN_ID,
# like agent-sim (ADR-0036). See docs/getting-started.md.
[tasks.hri-scenario]
cmd = "python -m walkie_agent.sim.hri_scenario config/scenarios/hri.yaml"
description = "Play the HRI scenario in the chula_pat14_6 simulation (the shell's ROS_DOMAIN_ID)"

# The same scenario, except that guest 2 does not hang the bag on the first
# hand-over request, so the robot's first close reads empty, and hangs it
# once the hand reopens in the receive pose for the silent retry.
[tasks.hri-scenario-missed-bag]
cmd = "python -m walkie_agent.sim.hri_scenario config/scenarios/hri_missed_bag.yaml"
description = "Play the HRI scenario with the bag missed on the first close (the shell's ROS_DOMAIN_ID)"

# agent-sim on the chula_pat14_6 world's named places, for the HRI scenario.
# agent-sim stays on config/locations.sim.toml for the blank map.
[tasks.agent-sim-hri]
cmd = "python -m walkie_agent.main --use-sim-time --locations config/locations.chula_pat14_6.toml --mock-people-memory --arms --tool-log"
description = "Run the agent on the chula_pat14_6 world's places (the shell's ROS_DOMAIN_ID)"

# The HRI pass check on a finished run: give it the scenario's event log and
# the agent's tool log, as in `pixi run hri-check logs/hri_scenario_<time>.jsonl
# logs/agent_tools_<time>.jsonl`. It needs no ROS. Exit code 0 is a pass, 1 a
# fail and 2 a run that is not valid (docs/architecture/hri.md).
[tasks.hri-check]
cmd = "python -m walkie_agent.sim.hri_check"
description = "Check an HRI run's event log and tool log against the pass criteria"

# The tests run on Fast DDS, which tests/conftest.py sets, so they need no
# Zenoh router (ADR-0019).
[tasks.test]
cmd = "pytest"
description = "Run the test suite"

# Voice interface (RAI's rai_s2s agents), configured by [asr] and [tts] in
# config.toml. See docs/setup/07-voice.md.
[tasks.voice-asr]
cmd = "python -m walkie_agent.voice asr"
description = "Listen on the microphone and send transcribed speech to /from_human"

[tasks.voice-tts]
cmd = "python -m walkie_agent.voice tts"
description = "Speak everything published on /to_human"

[tasks.list-audio-devices]
cmd = "python -c 'import sounddevice; print(sounddevice.query_devices())'"
description = "List microphone and speaker names for config.toml"

# The doorbell detector's model (ADR-0054): YAMNet's core network exported to
# ONNX by tools/export_yamnet.py, and its class map, from this repository's
# release doorbell-model-v1, whose NOTICE names their licences. Each file is
# checked against its pinned SHA-256 before it is moved into models/, so a
# failed or changed download fails the task and leaves no model in place. A
# failed download names the release, which a maintainer publishes as
# docs/setup/07-voice.md describes. A new export is a new release: its sums
# replace these.
[tasks.fetch-doorbell-model]
cmd = """mkdir -p models \
  && (wget --no-verbose --output-document models/yamnet.onnx.part \
  https://github.com/EIC-Robocup-2026/walkie-agent-ros/releases/download/doorbell-model-v1/yamnet.onnx \
  && wget --no-verbose --output-document models/yamnet_class_map.csv.part \
  https://github.com/EIC-Robocup-2026/walkie-agent-ros/releases/download/doorbell-model-v1/yamnet_class_map.csv \
  || (echo 'Cannot download the doorbell model from the release doorbell-model-v1 of EIC-Robocup-2026/walkie-agent-ros. If that release is not published yet, docs/setup/07-voice.md says how a maintainer publishes it.' >&2 \
  && exit 1)) \
  && echo '83fed6f30f0338c98e4d1dbbe12cfb5f4b2da03126792290eaee24a6a668bc6c  models/yamnet.onnx.part' \
  | sha256sum --check --strict \
  && echo 'cdf24d193e196d9e95912a2667051ae203e92a2ba09449218ccb40ef787c6df2  models/yamnet_class_map.csv.part' \
  | sha256sum --check --strict \
  && mv models/yamnet.onnx.part models/yamnet.onnx \
  && mv models/yamnet_class_map.csv.part models/yamnet_class_map.csv"""
description = "Download the doorbell detector's YAMNet model into models/ and check its SHA-256"

# The doorbell detector on the clips in tests/data/audio, with
# [walkie.doorbell.detector] from config.toml: each clip as a 16 kHz
# microphone delivers it, and through RAI's resample from a 48 and a 44.1 kHz
# one, at 8 onsets within a hop. Needs fetch-doorbell-model first. Exit code 0
# is a pass, with only the failures that tests/data/audio/known_failures.toml
# lists, and 1 a fail.
[tasks.doorbell-eval]
cmd = "python -m walkie_agent.doorbell eval tests/data/audio"
description = "Score the doorbell test clips at 16, 48 and 44.1 kHz and 8 onsets, and report what rings"

# Robot identity (RAI's rai_whoami). Calls the LLM and embeddings model from
# config.toml, so it costs a little each run. See docs/setup/06-whoami.md.
[tasks.whoami-build]
cmd = "build-whoami whoami --build-vector-db"
description = "Build Walkie's description and documentation index into whoami/generated/"

# Self-hosted Langfuse for tracing agent runs. Needs Docker on the host.
# See docs/setup/04-langfuse.md.
[tasks.langfuse-setup]
cmd = "python scripts/langfuse_setup.py"
description = "Generate Langfuse server secrets and add its API keys to .env"

[tasks.langfuse-up]
cmd = "docker compose --file docker/langfuse/compose.yml up --detach --wait --wait-timeout 300"
depends-on = ["langfuse-setup"]
description = "Start the local Langfuse server at http://localhost:3000"

[tasks.langfuse-down]
cmd = "docker compose --file docker/langfuse/compose.yml down"
description = "Stop the local Langfuse server (traces are kept)"

[tasks.langfuse-logs]
cmd = "docker compose --file docker/langfuse/compose.yml logs --follow langfuse-web langfuse-worker"
description = "Follow the Langfuse server logs"

[tasks.langfuse-reset]
cmd = "docker compose --file docker/langfuse/compose.yml down --volumes && rm docker/langfuse/.env"
description = "Delete the local Langfuse server, its stored traces and its secrets"

[feature.docs.tasks]
docs = "mkdocs serve"
docs-build = "mkdocs build --strict"

[feature.docs.dependencies]
mkdocs-material = ">=9.7,<10"
mkdocs = ">=1.6,<2"

# The docs environment leaves out the default feature, and with it the
# [activation.env] above. It has no ROS, but sets the same middleware so that
# every environment agrees (ADR-0033).
[feature.docs.activation.env]
RMW_IMPLEMENTATION = "rmw_zenoh_cpp"

[environments]
docs = { features = ["docs"], no-default-feature = true }
