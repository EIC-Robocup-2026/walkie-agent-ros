# Walkie's settings, read from the working directory.
#
# Who reads what:
# - The agent (walkie_agent.config and walkie_agent.chat_models): complex_model
#   and base_url of the vendor that [vendor] names, [agent] if present, and
#   [tracing.langfuse].
# - The agent's describe_objects tool, with --vision: describe_model, a model that
#   reads pictures, or simple_model when [vendor] names no describe_model.
# - The agent's get_facts tool (walkie_agent.capabilities.facts): [team]. The
#   agent does not start without it.
# - The voice entry points (walkie_agent.voice), through rai_s2s: [asr] and [tts].
# - Nothing in this repository reads embeddings_model, [tracing]'s project or
#   [tracing.langsmith]. They stay so the file keeps the shape of RAI's own config
#   (https://robotecai.github.io/rai/setup/vendors/). RAI's own loader,
#   load_config in rai.initialization.model_initialization, no longer accepts the
#   file, since its [vendor] takes no describe_model; nothing here calls it.
#
# No fallback model is selected. To use one, set both fallback_vendor and
# fallback_model in an [agent] table; that choice is the team's.
#
# Between tasks the agent summarizes the older part of a long history with its
# own complex_model. compact_after_tokens (default 12000, 0 turns it off) and
# compact_keep_tokens (default 3000) in an [agent] table change when and how
# much stays word for word.
#
# The `openai` vendor works with any OpenAI-compatible endpoint. Here it points
# at OpenRouter (same provider walkie-agent-v2 used); set OPENAI_API_KEY to an
# OpenRouter key. For a local server (vLLM, llama.cpp), change base_url.

[vendor]
simple_model = "openai"
complex_model = "openai"
embeddings_model = "openai"
describe_model = "openai"

[openai]
simple_model = "qwen/qwen3.8-27b:nitro"
complex_model = "deepseek/deepseek-v4.1-flash:nitro"
embeddings_model = "openai/text-embedding-3-small"
describe_model = "qwen/qwen3.8-27b:nitro"
base_url = "https://openrouter.ai/api/v1"

# Local models served by Ollama. Used only when a [vendor] entry is "ollama".
[ollama]
simple_model = "llama3.2"
complex_model = "llama3.1:70b"
embeddings_model = "llama3.2"
base_url = "http://localhost:11434"

# What get_facts says about the team, and the timezone of its time and date.
# The time comes from the computer's wall clock, never from ROS or sim time.
# timezone is an IANA name. Every value must be non-blank.
[team]
name = "EIC"
country = "Thailand"
affiliation = "Chulalongkorn University"
timezone = "Asia/Bangkok"

[tracing]
project = "walkie-agent-ros"

# To trace agent runs, start the local server with `pixi run langfuse-up` and
# set use_langfuse = true. Requires LANGFUSE_PUBLIC_KEY/SECRET_KEY in .env.
[tracing.langfuse]
use_langfuse = false
host = "http://localhost:3000"

[tracing.langsmith]
use_langsmith = false
host = "https://api.smith.langchain.com"

# Speech input (speech-to-text), used by `pixi run voice-asr`.
# transcription_model: "LocalWhisper" or "FasterWhisper" (local, free), or
# "OpenAI" (needs a real OpenAI key, not the OpenRouter key in .env).
# List microphone names with: pixi run list-audio-devices
# "default" is the system's default microphone, through PipeWire.
[asr]
recording_device_name = "default"
transcription_model = "LocalWhisper"
language = "en"
vad_model = "SileroVAD"
# Seconds of silence before the recording is cut and transcribed. Too short
# splits a sentence at every pause.
silence_grace_period = 1.0
# Speech probability (0-1) that counts as voice. Raise it in a noisy room.
vad_threshold = 0.3
use_wake_word = false
wake_word_model = ""
wake_word_threshold = 0.5
wake_word_model_name = ""
transcription_model_name = "tiny"

# Speech output (text-to-speech), used by `pixi run voice-tts`.
# vendor: "KokoroTTS" (local, free; downloads ~300 MB of model files on first
# use), "OpenTTS" (needs its Docker server) or "ElevenLabs" (cloud; needs
# ELEVENLABS_API_KEY and a voice). An empty voice uses the vendor's default.
# speaker_device_name: as recording_device_name in [asr].
[tts]
vendor = "KokoroTTS"
voice = ""
speaker_device_name = "default"
