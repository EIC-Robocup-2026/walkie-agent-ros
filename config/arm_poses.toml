# No SRDF state: the HRI bag hand-over (hri.md, "The bag hand-over").
# Recorded in the MuJoCo simulation on 2026-10-23: with the lift raised to
# 0.7435 m, walkie-agent-v2's Cartesian target for the hand-over (x 0.45,
# y 0.16, z 1.15, roll -0.8, pitch 0, yaw -1.57 in base_footprint) was sent
# once through /go_to_pose, and the joints were read with /get_joint_states.
# The agent never sends Cartesian goals itself. Re-record it on the robot,
# the same way, before the robot run.
[poses.receive]
travel_safe = false
tried_on_robot = false
description = "Left hand held out in front, to take a bag from a person."

[poses.receive.left]
openarm_left_joint1 = -0.0658863214414044
openarm_left_joint2 = -0.07971820689149219
openarm_left_joint3 = 0.015474061909107776
openarm_left_joint4 = 1.8928851211307536
openarm_left_joint5 = 1.5010163287531721
openarm_left_joint6 = 0.3812924696543403
openarm_left_joint7 = 0.027460132968568748

# No SRDF state: where the hand-over ends, holding the bag. Recorded like
# receive, reached from receive, from walkie-agent-v2's carry target (x 0.1413,
# y 0.0481, z 0.9640, roll -1.2972, pitch -0.3040, yaw -3.0219). The right
# table mirrors the left: every joint negated except joint 4, as in the SRDF
# presets and the mirrored limits of joints 1 and 2. In the simulation the
# right hand landed within 6 mm of the left hand's position with y negated.
# Re-record both tables on the robot before the robot run.
[poses.carry]
travel_safe = true       # required: the robot guides the guest holding the bag
both_arms = false        # both in carry, the hands meet in front of the body
                         # and MoveIt finds no plan
tried_on_robot = false
description = "Holding an object close to the body."

