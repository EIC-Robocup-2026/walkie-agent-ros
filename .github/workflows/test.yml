name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its previous run. Runs on main are never
# cancelled, so every commit on main gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The default environment takes about 11 GB, mostly PyTorch and its CUDA
      # libraries (see docs/setup/07-voice.md). Remove preinstalled SDKs that
      # are not needed here so it fits on the runner's disk.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v7

      # Only runs on main save the environment to the cache; pull requests
      # restore it. Each saved environment is several GB, and the repository's
      # cache storage is limited.
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      # Every test needs rai_interfaces, walkie_database_msgs and
      # walkie_vision_msgs (tests/conftest.py stops without them). None is
      # packaged, so build-ros2 builds them from source here, from
      # ros2_ws.repos.
      - name: Build ROS 2 workspace
        run: pixi run build-ros2

      - name: Run tests
        run: pixi run test
