# Self-hosted Langfuse for tracing the Walkie agent during development.
#
# Adapted from the upstream file:
# https://github.com/langfuse/langfuse/blob/v3.225.11/docker-compose.yml
#
# Changes from upstream:
#   - Pinned to the v3 server. rai-core requires the langfuse Python SDK <4,
#     and a v4 server delays traces sent by older SDKs.
#   - Every port binds to 127.0.0.1, and only the web UI (3000) and MinIO
#     (9090, used for media uploads) are published at all.
#   - No default secrets. They come from docker/langfuse/.env, which
#     `pixi run langfuse-setup` generates.
#   - LANGFUSE_INIT_* creates the user, project and API keys on first start,
#     so the agent's keys are known without visiting the UI.
#   - Usage telemetry to Langfuse is off.
#
# Start with `pixi run langfuse-up`. See docs/setup/04-langfuse.md.

name: walkie-langfuse

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: http://localhost:3000
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?run pixi run langfuse-setup}@postgres:5432/postgres
  SALT: ${SALT:?run pixi run langfuse-setup}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?run pixi run langfuse-setup}
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run pixi run langfuse-setup}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?run pixi run langfuse-setup}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?run pixi run langfuse-setup}
  # Clients upload media to this URL directly, so it is the host-side port.
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_AUTH:?run pixi run langfuse-setup}
  REDIS_TLS_ENABLED: "false"

x-depends-on: &depends-on
  postgres:
    condition: service_healthy
  minio:
    condition: service_healthy
  redis:
    condition: service_healthy
  clickhouse:
    condition: service_healthy

services:
  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on: *depends-on
    environment: *langfuse-env

  langfuse-web:
    image: docker.io/langfuse/langfuse:3
    restart: unless-stopped
    depends_on: *depends-on
    ports:
      - 127.0.0.1:3000:3000
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?run pixi run langfuse-setup}
      LANGFUSE_INIT_ORG_ID: walkie
      LANGFUSE_INIT_ORG_NAME: Walkie
      LANGFUSE_INIT_PROJECT_ID: walkie-agent-ros
      LANGFUSE_INIT_PROJECT_NAME: walkie-agent-ros
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?run pixi run langfuse-setup}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?run pixi run langfuse-setup}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?run pixi run langfuse-setup}
      LANGFUSE_INIT_USER_NAME: Walkie Developer
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?run pixi run langfuse-setup}
    # Lets `docker compose up --wait` return only once the UI is usable.
    # The server listens on the container hostname, not on 127.0.0.1.
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://$$(hostname):3000/api/public/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run pixi run langfuse-setup}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  minio:
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    entrypoint: sh
    # Create the 'langfuse' bucket before starting the server.
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run pixi run langfuse-setup}
    ports:
      - 127.0.0.1:9090:9000
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  redis:
    image: docker.io/redis:7
    restart: unless-stopped
    command: >
      --requirepass ${REDIS_AUTH:?run pixi run langfuse-setup}
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  postgres:
    image: docker.io/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run pixi run langfuse-setup}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
  redis_data:
